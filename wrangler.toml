TRAIDE_EVM_TIP_ADDRESS = "0x897025A3d0260fAeA5Dc705e2037b8AFB0480F23"
TRAIDE_SOLANA_TIP_ADDRESS = "pending"
QUOTE_CACHE_TTL_SECONDS = "5"
